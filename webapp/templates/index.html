<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h1 class="h3 mb-0"><i class="fas fa-language me-2"></i>Neural Language Translator</h1>
                    </div>
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="model-select" class="form-label">Translation Model</label>
                                    <select id="model-select" class="form-select">
                                        {% for model in models %}
                                        <option value="{{ model.name }}">
                                            {{ model.source_language }} to {{ model.target_language }}
                                        </option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6 d-flex align-items-end">
                                <div id="model-info" class="text-muted small">
                                    <!-- Model info will be displayed here -->
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label for="source-text" class="form-label" id="source-lang-label">Source Text</label>
                                    <textarea id="source-text" class="form-control" rows="8" placeholder="Enter text to translate..."></textarea>
                                </div>
                                <div class="text-end">
                                    <button id="clear-source" class="btn btn-sm btn-outline-secondary me-2">
                                        <i class="fas fa-eraser me-1"></i>Clear
                                    </button>
                                    <button id="translate-btn" class="btn btn-primary">
                                        <i class="fas fa-exchange-alt me-1"></i>Translate
                                    </button>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label for="target-text" class="form-label" id="target-lang-label">Translation</label>
                                    <textarea id="target-text" class="form-control" rows="8" readonly placeholder="Translation will appear here..."></textarea>
                                </div>
                                <div class="text-end">
                                    <button id="copy-translation" class="btn btn-sm btn-outline-secondary">
                                        <i class="fas fa-copy me-1"></i>Copy
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer text-center">
                        <p class="text-muted mb-0">
                            <small>
                                Built with <i class="fas fa-heart text-danger"></i> using PyTorch and Transformer architecture
                                | <a href="https://github.com/jmhasan1/Language_Translator_Transformer_Model" target="_blank"><i class="fab fa-github"></i> View on GitHub</a>
                            </small>
                        </p>
                    </div>
                </div>
                
                <!-- Translation History -->
                <div class="card mt-4 shadow">
                    <div class="card-header bg-light">
                        <h3 class="h5 mb-0">
                            <i class="fas fa-history me-2"></i>Recent Translations
                            <button id="clear-history" class="btn btn-sm btn-outline-danger float-end">Clear History</button>
                        </h3>
                    </div>
                    <div class="card-body p-0">
                        <ul id="translation-history" class="list-group list-group-flush">
                            <!-- Translation history will be added here -->
                            <li class="list-group-item text-center text-muted">No recent translations</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading spinner overlay -->
    <div id="loading-overlay" class="d-none">
        <div class="spinner-container">
            <div class="spinner-border text-light" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="text-light mt-2">Translating...</p>
        </div>
    </div>

    <!-- Error Toast -->
    <div class="position-fixed bottom-0 end-0 p-3" style="
